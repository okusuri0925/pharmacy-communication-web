<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません｜薬局コミュニケーション</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0017c1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--main:#0017c1;--focus:#ffd43b;--ink:#1a1a1a;--muted:#4b5563}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#fff;line-height:1.7}.wrap{max-width:820px;margin:0 auto;padding:72px 24px}.mark{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:var(--main);color:#fff;font-size:34px;font-weight:800}.code{margin:22px 0 6px;color:var(--main);font-weight:800;letter-spacing:.08em}.wrap h1{margin:0;font-size:clamp(34px,6vw,54px);line-height:1.3}.lead{margin:20px 0 30px;font-size:20px;color:#333}.btn{display:inline-block;padding:14px 22px;background:var(--main);color:#fff;text-decoration:none;font-weight:700;border-radius:4px}.btn:focus-visible{outline:4px solid var(--focus);outline-offset:4px}.note{margin-top:30px;padding-top:20px;border-top:1px solid #ccc;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main class="wrap">
<div class="mark" aria-hidden="true">?</div>
<p class="code">404</p>
<h1>ページが見つかりません</h1>
<p class="lead">URLが変更されたか、入力したアドレスが正しくない可能性があります。薬局コミュニケーションのトップページから、もう一度お探しください。</p>
<a class="btn" id="homeLink" href="./">トップページへ戻る</a>
<p class="note">このページでは入力内容の保存や送信は行いません。</p>
</main>
<script>
(function(){
  const a=document.getElementById('homeLink');
  const host=location.hostname;
  if(host.endsWith('.github.io')){
    const parts=location.pathname.split('/').filter(Boolean);
    a.href=parts.length ? '/' + parts[0] + '/' : '/';
  } else {
    a.href='/';
  }
})();
</script>
</body>
</html>
